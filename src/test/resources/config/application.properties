# Configuracion SOLO para pruebas. Spring Boot la fusiona con
# src/main/resources/application.properties y tiene precedencia sobre ella.
#
# Las pruebas que levantan el contexto completo necesitan un secreto JWT.
# Se fija aqui un valor de prueba (48 bytes, sin valor real) para que
# "mvnw clean verify" funcione en cualquier equipo sin variables de entorno.
# La aplicacion en ejecucion NO lo usa: alli PULSEPASS_JWT_SECRET_BASE64 es
# obligatoria y no tiene valor por defecto.
pulsepass.security.jwt.secret-base64=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLXB1bHNlcGFzcy10ZXN0cy0wMDAwMDA=
